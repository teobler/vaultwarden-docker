name: vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:latest
    restart: unless-stopped
    environment:
      DOMAIN: https://${VAULTWARDEN_DOMAIN}
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-false}
      INVITATIONS_ALLOWED: ${INVITATIONS_ALLOWED:-true}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SHOW_PASSWORD_HINT: "false"
      ROCKET_PORT: "80"
    volumes:
      - ./data:/data
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      TUNNEL_TRANSPORT_PROTOCOL: quic

  backup-watch:
    image: alpine:3.22
    restart: unless-stopped
    environment:
      BACKUP_WATCH_RETENTION: ${BACKUP_WATCH_RETENTION:-15}
      BACKUP_WATCH_DEBOUNCE: ${BACKUP_WATCH_DEBOUNCE:-300}
      DATA_DIR: /data
      BACKUP_DIR: /backup
      BACKUP_LOG: /logs/backup_watch.log
    volumes:
      - ./data:/data:ro
      - ./backups:/backup
      - ./logs:/logs
      - ./backup:/scripts:ro
    command: sh -c "apk add --no-cache inotify-tools sqlite tzdata && sh /scripts/backup-watch.sh"

  backup-scheduled:
    image: alpine:3.22
    restart: unless-stopped
    environment:
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * 0}
      BACKUP_SCHEDULED_RETENTION: ${BACKUP_SCHEDULED_RETENTION:-5}
      DATA_DIR: /data
      BACKUP_DIR: /backup
      BACKUP_LOG: /logs/backup_scheduled.log
    volumes:
      - ./data:/data:ro
      - ./backups:/backup
      - ./logs:/logs
      - ./backup:/scripts:ro
    command: sh -c "apk add --no-cache sqlite tzdata && printf '%s sh /scripts/backup-local.sh scheduled >> /logs/backup_scheduled.log 2>&1\\n' \"$$BACKUP_SCHEDULE\" > /etc/crontabs/root && crond -f -l 2"

  backup-sync:
    image: rclone/rclone:latest
    restart: unless-stopped
    environment:
      BACKUP_SYNC_SCHEDULE: ${BACKUP_SYNC_SCHEDULE:-*/10 * * * *}
      RCLONE_REMOTE: ${RCLONE_REMOTE}
      DATA_DIR: /backup
      BACKUP_LOG: /logs/backup_sync.log
    volumes:
      - ./backups:/backup:ro
      - ./logs:/logs
      - ${RCLONE_CONFIG_HOST:-./rclone}:/config/rclone:ro
      - ./backup:/scripts:ro
    entrypoint: []
    command: sh -c "apk add --no-cache tzdata && printf '%s sh /scripts/backup-sync.sh >> /logs/backup_sync.log 2>&1\\n' \"$$BACKUP_SYNC_SCHEDULE\" > /etc/crontabs/root && crond -f -l 2"
